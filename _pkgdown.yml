url: https://werkstattcodes.github.io/ParlAT
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: materia
    pkgdown-navbar-bg: "#FFFFFF"

    
navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
  - title: "main functions"
    contents:
      - get_committees
      - get_events
      - get_items
      - get_item_details
      - get_mandates
      - get_mps
      - get_mps_current
      - get_mps_details
      - get_participation
      - get_persons
      - get_plenary_meeting_details
      - get_plenary_meetings
      - get_transcripts

  - title: "auxiliary functions"
    contents:
     - get_names
     - get_pad_intern
     - get_legis_periods
 

build:
  exclude:
    - CLAUDE.md
    - journal.md
    - .github/copilot-instructions.md

authors:
  Roland Schmidt:
    href: https://werk.statt.codes
